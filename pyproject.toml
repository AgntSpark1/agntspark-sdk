[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agntspark"
version = "1.2.0"
description = "Official Python SDK for the AgntSpark AI Agent hosting platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "AgntSpark LLC", email = "dev@agntspark.io" },
]
keywords = ["agntspark", "ai", "agents", "sdk", "hosting", "deployment", "llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "aiohttp>=3.9.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "respx>=0.20.0",
    "ruff>=0.4.0",
    "mypy>=1.7.0",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/AgntSpark1/agntspark-sdk"
Documentation = "https://docs.agntspark.io/sdk/python"
Repository = "https://github.com/AgntSpark1/agntspark-sdk"
Issues = "https://github.com/AgntSpark1/agntspark-sdk/issues"
Changelog = "https://github.com/AgntSpark1/agntspark-sdk/blob/main/CHANGELOG.md"

[project.scripts]
agntspark = "agntspark.cli:main"

[tool.setuptools.packages.find]
include = ["agntspark*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4"]

[tool.ruff.lint.per-file-ignores]
# models.py's classes are Pydantic BaseModels. Pydantic v2 resolves string
# annotations (from `from __future__ import annotations`) at class-
# definition time to build its validation schema — on Python 3.9 (which
# this package's own CI matrix and target-version still support), that
# resolution crashes on PEP 604 `X | None` unions and builtin-generic
# `list[X]`/`dict[X, Y]` subscripts, since those aren't real runtime
# expressions until 3.10. UP006/UP035/UP045 want exactly that syntax, so
# they're wrong for this specific file — `ruff check --fix` previously
# "fixed" this file straight into a Python-3.9 TestClient/TestModels
# collection crash. Keep Optional/Dict/List from `typing` here.
"agntspark/models.py" = ["UP006", "UP035", "UP045"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
